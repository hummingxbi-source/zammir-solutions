<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cuestionario ZAMMIR</title>
<style>
:root{
  --fondo:#f5f6f8; --tarjeta:#ffffff; --texto:#14202b; --suave:#5d6b78; --linea:#d9dfe5;
  --acento:#0b6e8a; --acento-fuerte:#085870; --acento-suave:#e3f2f7; --sobre-acento:#ffffff;
  --aviso:#fff4d6; --aviso-texto:#6b4b00; --sombra:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --fondo:#0e151b; --tarjeta:#16212a; --texto:#eaf0f5; --suave:#9fb0be; --linea:#2a3947;
    --acento:#4cc2e0; --acento-fuerte:#7ad3ea; --acento-suave:#12313c; --sobre-acento:#06222c;
    --aviso:#3a2f10; --aviso-texto:#f3d98a; --sombra:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
[hidden]{display:none !important}

.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--fondo);padding:12px 16px 10px;
  padding-top:max(12px,env(safe-area-inset-top))}
.top-in{max-width:640px;margin:0 auto}
.top-fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;font-size:14px;color:var(--suave)}
.marca-zammir{font-weight:800;letter-spacing:.12em;color:var(--texto);font-size:13px}
.barra{height:6px;border-radius:99px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);border-radius:99px;transition:width .3s ease}

main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 16px 130px;outline:none}
.pantalla{animation:entra .28s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pantalla{animation:none}.barra i{transition:none}}

.eyebrow{margin:8px 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento-fuerte)}
.titulo{margin:0 0 8px;font-size:clamp(23px,6vw,31px);line-height:1.2;font-weight:750;letter-spacing:-.01em}
.ayuda{margin:0 0 22px;color:var(--suave);font-size:16px}

.ops{display:grid;gap:10px;grid-template-columns:1fr}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:14px 16px;text-align:left;
  background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:16px;box-shadow:var(--sombra);
  transition:border-color .15s,background .15s}
.op .marca{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--linea);display:grid;place-items:center;transition:.15s}
.multi .op .marca{border-radius:7px}
.op .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.op.on{border-color:var(--acento);background:var(--acento-suave)}
.op.on .marca{background:var(--acento);border-color:var(--acento)}
.op.on .marca::after{content:"";width:6px;height:11px;border:solid var(--sobre-acento);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media (hover:hover){.op:hover{border-color:var(--acento)}}
@media (min-width:560px){.multi{grid-template-columns:1fr 1fr}}

.otro{display:block;margin-top:14px}
.otro span,.coment label{display:block;margin-bottom:6px;font-size:14px;color:var(--suave)}
input[type=text],textarea{width:100%;padding:13px 14px;background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:14px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--acento);outline:none;box-shadow:0 0 0 3px var(--acento-suave)}
.coment{margin-top:18px}
.enlace{margin-top:16px;padding:10px 4px;min-height:44px;background:none;border:0;color:var(--acento-fuerte);font-weight:600;font-size:16px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--fondo);border-top:1px solid var(--linea);
  padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.dock-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:650;white-space:nowrap}
.btn.primario{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.btn.grande{min-height:58px;font-size:18px;width:100%}
.dock .btn.primario{flex:1}
.dock .btn:not(.primario){flex:none;min-width:96px}
@media (max-width:359px){.dock .btn{padding:0 12px}.dock .btn:not(.primario){min-width:84px}}

/* Bienvenida */
.hero{padding-top:6vh}
.logo{width:56px;height:56px;border-radius:16px;background:var(--acento);color:var(--sobre-acento);display:grid;place-items:center;font-weight:800;font-size:28px;margin-bottom:22px}
.hero h1{margin:0 0 10px;font-size:clamp(30px,9vw,42px);line-height:1.1;letter-spacing:-.02em}
.hero p{margin:0 0 18px;color:var(--suave);font-size:18px}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;padding:0;list-style:none}
.datos li{padding:7px 14px;border-radius:99px;background:var(--tarjeta);border:1px solid var(--linea);font-size:15px;font-weight:600}
.nota{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--acento-suave);font-size:15px}
.segundo{display:block;margin:14px auto 0;background:none;border:0;color:var(--suave);text-decoration:underline;padding:10px;min-height:44px;font-size:15px}

/* Resumen */
.bloque{margin:22px 0 0}
.bloque h2{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acento-fuerte)}
.fila{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 14px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;margin-bottom:8px}
.fila .q{font-size:14px;color:var(--suave)}
.fila .a{font-weight:600;overflow-wrap:anywhere}
.fila .a.vacia{font-weight:400;color:var(--suave);font-style:italic}
.fila .cuerpo{flex:1;min-width:0}
.fila button{flex:none;background:none;border:0;color:var(--acento-fuerte);font-weight:600;min-height:44px;padding:0 6px}
.aparte{margin-top:22px;padding:16px;border-radius:16px;background:var(--aviso);color:var(--aviso-texto)}
.aparte strong{display:block;margin-bottom:6px}
.aparte ul{margin:0;padding-left:20px}
.acciones{display:grid;gap:10px;margin-top:26px}
.aviso-envio{margin-top:12px;font-size:15px;color:var(--suave)}
.peligro{background:none;border:0;color:var(--suave);text-decoration:underline;margin-top:22px;min-height:44px;padding:8px;font-size:15px}

#falla,.sin-js{max-width:640px;margin:16px;padding:16px;border-radius:14px;background:var(--aviso);color:var(--aviso-texto)}
@media (min-width:640px){#falla,.sin-js{margin:24px auto}}
</style>
</head>
<body>
<noscript><div class="sin-js"><strong>Este cuestionario necesita JavaScript.</strong> Ábrelo en Chrome, Safari o Edge actualizados.</div></noscript>
<div id="falla" hidden><strong>No se pudo iniciar el cuestionario en este navegador.</strong> Ábrelo con Chrome, Safari o Edge actualizados (no desde la vista previa de WhatsApp o del correo).</div>

<div class="app">
  <header class="top" id="top" hidden>
    <div class="top-in">
      <div class="top-fila"><span class="marca-zammir">ZAMMIR</span><span id="estado"></span></div>
      <div class="barra" aria-hidden="true"><i id="progreso"></i></div>
    </div>
  </header>
  <main id="pantalla" tabindex="-1"></main>
  <footer class="dock" id="dock" hidden>
    <div class="dock-in">
      <button type="button" class="btn" id="btnAtras">&larr; Atrás</button>
      <button type="button" class="btn primario" id="btnSig">Siguiente &rarr;</button>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  // Número de WhatsApp de HummingX (solo dígitos, con 52). Vacío = WhatsApp deja elegir el contacto.
  var NUMERO_WHATSAPP = '';
  var CLAVE = 'zammir-cuestionario-luis-v2';

  /* ---------------- Preguntas ----------------
     tipo: uno | varios | texto.  otro: agrega un campo "Otro".  nota: abre el comentario de entrada. */
  var PREGUNTAS = [
    // ---- Para facturar
    { s: 'Para facturar', tipo: 'varios', id: 'mandar',
      t: 'Mándanos estas cosas por WhatsApp. ¿Cuáles ya tienes a la mano?',
      ayuda: 'Con la foto de tu constancia sacamos razón social, RFC, régimen y código postal. No tienes que escribir nada.',
      op: ['Foto de la constancia de situación fiscal', 'Logo del negocio', 'Lista de productos y precios (foto o Excel)'] },
    { s: 'Para facturar', tipo: 'uno', id: 'efirma',
      t: '¿Tienen e.firma vigente?',
      ayuda: 'La necesitamos para sacar el certificado de sello digital. Nosotros te guiamos y nosotros subimos los archivos.',
      op: ['Sí', 'No', 'No sé'] },
    { s: 'Para facturar', tipo: 'uno', id: 'iva',
      t: '¿Venden algo con IVA 0 % o exento?',
      op: ['No, todo lleva IVA 16 %', 'Sí, algunas cosas', 'No sé, lo veo con mi contador'] },
    { s: 'Para facturar', tipo: 'uno', id: 'anticipos',
      t: 'Cuando un cliente deja anticipo, ¿cuándo se factura?',
      op: ['Una sola vez, al liquidar', 'Una por el anticipo y otra al final', 'Lo que diga mi contador'] },
    { s: 'Para facturar', tipo: 'uno', id: 'quienfactura',
      t: '¿Quién debe poder facturar?',
      op: ['Solo Luis y Ricardo', 'También quien atiende el mostrador', 'No sé todavía'] },

    // ---- A medida
    { s: 'Lo que fabrican a medida', tipo: 'varios', id: 'amedida', otro: true,
      t: '¿Qué trabajos hacen a medida?',
      ayuda: 'Marca todos los que hacen.',
      op: ['Vidrio cortado a medida', 'Vidrio templado', 'Vidrio laminado', 'Espejos', 'Ventanas de aluminio', 'Puertas de aluminio',
           'Puertas de cristal', 'Canceles de baño', 'Mamparas', 'Barandales', 'Acrílico', 'Policarbonato',
           'Domos y tragaluces', 'Vidrio decorado o esmerilado', 'Cubiertas para mesa'] },
    { s: 'Lo que fabrican a medida', tipo: 'uno', id: 'canceles',
      t: 'Canceles de baño, mamparas y barandales: ¿cómo los cotizan?',
      op: ['Un solo precio, ya armado', 'El vidrio y los herrajes por separado', 'Depende del trabajo', 'No los hacemos'] },
    { s: 'Lo que fabrican a medida', tipo: 'uno', id: 'taller', nota: true,
      t: 'Cantos pulidos, perforaciones y biselados: ¿cómo se cobran?',
      op: ['Se cobran aparte', 'Van incluidos en el precio del vidrio', 'Depende del trabajo'],
      notaTxt: 'Si es aparte, ¿cómo lo cobran? (por pieza, por metro, monto fijo…)' },
    { s: 'Lo que fabrican a medida', tipo: 'uno', id: 'instalacion',
      t: 'La instalación, ¿cómo se cobra?',
      op: ['Aparte del material', 'Va incluida en el precio', 'Depende del trabajo', 'No instalamos'] },
    { s: 'Lo que fabrican a medida', tipo: 'uno', id: 'flete',
      t: 'Medición a domicilio y flete: ¿se cobran?',
      op: ['Sí, siempre', 'Sí, pero se descuentan si contratan el trabajo', 'No se cobran', 'Depende de la distancia'] },

    // ---- Mostrador
    { s: 'Lo que venden en mostrador', tipo: 'varios', id: 'mostrador', otro: true,
      t: '¿Qué venden sin medida, directo en el mostrador?',
      ayuda: 'Marca todo lo que se vende.',
      op: ['Chapas y cerraduras', 'Bisagras y pivotes', 'Jaladeras y manijas', 'Felpa y vinil', 'Silicón y selladores',
           'Rieles y rodajas', 'Perfil de aluminio suelto', 'Tornillería y taquetes', 'Ventosas y accesorios',
           'Vidrios y espejos chicos ya cortados', 'Puertas y ventanas ya hechas', 'Discos y consumibles'] },
    { s: 'Lo que venden en mostrador', tipo: 'uno', id: 'metrolineal',
      t: 'Lo que se vende por metro (perfiles, molduras): ¿se cobra por…?',
      op: ['El largo que se captura', 'El perímetro de la pieza', 'Depende del producto', 'No vendemos por metro'] },
    { s: 'Lo que venden en mostrador', tipo: 'uno', id: 'minimo', nota: true,
      t: '¿Hay cobro mínimo?',
      op: ['No, se cobra la medida exacta', 'Sí, un área mínima', 'Sí, un monto mínimo por trabajo'],
      notaTxt: 'Si hay mínimo, ¿de cuánto?' },
    { s: 'Lo que venden en mostrador', tipo: 'uno', id: 'existencias',
      t: '¿Quieren llevar cuántas piezas hay en existencia?',
      op: ['No, solo cotizar y cobrar', 'Sí, las piezas ya hechas', 'Sí, también hojas de vidrio y material en bodega'] },
    { s: 'Lo que venden en mostrador', tipo: 'texto', id: 'faltante',
      t: '¿Qué más venden o hacen que no aparece aquí?',
      ayuda: 'Cualquier producto, servicio o caso especial. Mientras más exacto, mejor.',
      ph: 'Escríbelo como te salga, o mándanos un audio por WhatsApp.' },

    // ---- Cómo trabajan
    { s: 'Cómo trabajan', tipo: 'uno', id: 'descuentos', nota: true,
      t: '¿Quién puede dar descuentos?',
      op: ['Solo Luis y Ricardo', 'Cualquiera, hasta un límite', 'No damos descuentos'],
      notaTxt: 'Si hay un límite, ¿de cuánto?' },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'anticipo', nota: true,
      t: 'Anticipo en trabajos a medida: ¿de cuánto?',
      op: ['50 %', '30 %', 'Depende del trabajo', 'No piden anticipo'],
      notaTxt: 'Si depende, ¿de qué?' },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'sinanticipo',
      t: '¿Se puede empezar a fabricar sin anticipo?',
      op: ['Nunca', 'Con autorización de Luis o Ricardo', 'Sí, sin problema'] },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'cancelacion',
      t: 'Si cancelan un trabajo que ya dejó anticipo, el anticipo…',
      op: ['Se devuelve', 'Se queda', 'Depende'] },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'medidafinal',
      t: 'Si al medir en obra la medida cambia, ¿qué pasa con el precio?',
      op: ['Se ajusta y lo autoriza Luis o Ricardo', 'Se respeta el precio cotizado', 'Depende de cuánto cambie'] },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'parciales',
      t: '¿Entregan trabajos por partes?',
      op: ['Nunca, se entrega completo', 'A veces'] },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'tiempos',
      t: '¿Cuánto tardan normalmente en entregar un trabajo a medida?',
      op: ['El mismo día', '1 a 3 días', '4 a 7 días', 'Más de una semana', 'Depende del trabajo'] },
    { s: 'Cómo trabajan', tipo: 'uno', id: 'garantia', nota: true,
      t: '¿Cuánto dura la garantía?',
      op: ['30 días', '3 meses', '6 meses', '1 año', 'Depende del producto'],
      notaTxt: '¿Qué cubre y qué no cubre?' },

    // ---- Caja y local
    { s: 'Caja y local', tipo: 'uno', id: 'cajeros',
      t: '¿Cuántas personas cobran en un día normal?',
      op: ['Una', 'Dos', 'Tres o más'] },
    { s: 'Caja y local', tipo: 'uno', id: 'efectivoobra',
      t: 'El efectivo que se cobra en obra o a domicilio, ¿cuándo se entrega?',
      op: ['El mismo día', 'Al día siguiente', 'Depende'] },
    { s: 'Caja y local', tipo: 'uno', id: 'salidas',
      t: '¿Sacan dinero del cajón durante el día (gastos, proveedores)?',
      op: ['Sí', 'A veces', 'No'] },
    { s: 'Caja y local', tipo: 'uno', id: 'internet',
      t: '¿Cómo es el internet donde está el mostrador?',
      op: ['Wi-Fi estable', 'Hay Wi-Fi, pero se cae seguido', 'No hay Wi-Fi, solo datos del celular', 'No sé'] },

    // ---- Fechas
    { s: 'Fechas de entrega', tipo: 'varios', id: 'dias',
      t: '¿Qué días pueden para la capacitación y las pruebas?',
      ayuda: 'Marca todos los que puedan. Cada sesión dura de 2 a 3 horas, en el local.',
      op: ['Lun 23 nov', 'Mar 24 nov', 'Mié 25 nov', 'Jue 26 nov', 'Vie 27 nov', 'Sáb 28 nov', 'Dom 29 nov', 'Lun 30 nov', 'Mar 1 dic'] },
    { s: 'Fechas de entrega', tipo: 'uno', id: 'hora',
      t: '¿A qué hora les queda mejor?',
      op: ['Por la mañana', 'Por la tarde', 'Cualquiera'] }
  ];

  var N = PREGUNTAS.length;
  var FINAL = N + 1;

  /* ---------------- Utilidades ---------------- */
  var est = { paso: 0, r: {}, com: false };
  var pan = document.getElementById('pantalla');
  var timer = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function recorta(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }
  function R(id) {
    if (!est.r[id]) { est.r[id] = { v: null, o: '', c: '' }; }
    return est.r[id];
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify({ paso: est.paso, r: est.r })); } catch (e) { /* sin almacenamiento: sigue funcionando */ }
  }
  function cargar() {
    try {
      var g = JSON.parse(localStorage.getItem(CLAVE) || 'null');
      if (g && typeof g === 'object') {
        est.r = g.r && typeof g.r === 'object' ? g.r : {};
        est.paso = typeof g.paso === 'number' && g.paso >= 0 && g.paso <= FINAL ? g.paso : 0;
      }
    } catch (e) { /* ignora datos dañados */ }
  }
  function hayRespuestas() {
    for (var i = 0; i < N; i++) { if (respondida(PREGUNTAS[i])) { return true; } }
    return false;
  }
  function respondida(q) {
    var r = est.r[q.id];
    if (!r) { return false; }
    if (q.tipo === 'varios') { return (r.v && r.v.length > 0) || recorta(r.o) !== ''; }
    return !!(r.v && recorta(r.v) !== '');
  }
  function textoRespuesta(q) {
    var r = est.r[q.id];
    if (!r) { return ''; }
    var partes = [];
    if (q.tipo === 'varios') {
      if (r.v && r.v.length) { partes.push(r.v.join(', ')); }
      if (recorta(r.o)) { partes.push('Otro: ' + recorta(r.o)); }
    } else if (r.v) {
      partes.push(recorta(r.v));
    }
    return partes.join(' · ');
  }

  /* ---------------- Pantallas ---------------- */
  function htmlBienvenida() {
    var sigue = est.paso > 0 || hayRespuestas();
    return '<section class="pantalla hero">' +
      '<div class="logo" aria-hidden="true">Z</div>' +
      '<h1>Hola, Luis</h1>' +
      '<p>Solo te preguntamos lo que únicamente tú sabes sobre ZAMMIR. Lo técnico lo resolvemos nosotros.</p>' +
      '<ul class="datos"><li>' + N + ' preguntas</li><li>Unos 10 minutos</li><li>Se guarda solo</li></ul>' +
      '<button type="button" class="btn primario grande" id="btnEmpezar">' + (sigue ? 'Seguir donde me quedé' : 'Empezar') + '</button>' +
      (sigue ? '<button type="button" class="segundo" data-act="reiniciar">Empezar de nuevo</button>' : '') +
      '<div class="nota">Casi todo se contesta tocando. Si no sabes algo, pasa a la siguiente: no pasa nada.</div>' +
      '</section>';
  }

  function htmlPregunta(q) {
    var r = R(q.id);
    var h = '<section class="pantalla"><p class="eyebrow">' + esc(q.s) + '</p>' +
      '<h1 class="titulo">' + esc(q.t) + '</h1>';
    if (q.ayuda) { h += '<p class="ayuda">' + esc(q.ayuda) + '</p>'; } else { h += '<div style="height:14px"></div>'; }
    if (q.tipo === 'texto') {
      h += '<textarea id="campo" rows="6" placeholder="' + esc(q.ph || 'Escribe aquí…') + '" aria-label="Tu respuesta">' + esc(r.v || '') + '</textarea>';
    } else {
      h += '<div class="ops' + (q.tipo === 'varios' ? ' multi' : '') + '" role="group">';
      for (var k = 0; k < q.op.length; k++) {
        var on = q.tipo === 'varios' ? (r.v || []).indexOf(q.op[k]) > -1 : r.v === q.op[k];
        h += '<button type="button" class="op' + (on ? ' on' : '') + '" data-k="' + k + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
          '<span class="marca" aria-hidden="true"></span><span class="txt">' + esc(q.op[k]) + '</span></button>';
      }
      h += '</div>';
      if (q.otro) {
        h += '<label class="otro"><span>¿Algo más? Escríbelo aquí</span><input type="text" id="otro" value="' + esc(r.o || '') + '" autocomplete="off"></label>';
      }
      if (q.nota || est.com || recorta(r.c) !== '') {
        h += '<div class="coment"><label for="coment">' + esc(q.notaTxt || '¿Quieres agregar algo?') + '</label>' +
          '<textarea id="coment" rows="3">' + esc(r.c || '') + '</textarea></div>';
      } else {
        h += '<button type="button" class="enlace" data-act="coment">+ Agregar un comentario</button>';
      }
    }
    return h + '</section>';
  }

  function resumenPorSeccion() {
    var orden = [], mapa = {};
    for (var i = 0; i < N; i++) {
      var q = PREGUNTAS[i];
      if (!mapa[q.s]) { mapa[q.s] = []; orden.push(q.s); }
      mapa[q.s].push(i);
    }
    return { orden: orden, mapa: mapa };
  }

  function htmlResumen() {
    var contestadas = 0, i;
    for (i = 0; i < N; i++) { if (respondida(PREGUNTAS[i])) { contestadas++; } }
    var h = '<section class="pantalla"><p class="eyebrow">Último paso</p>' +
      '<h1 class="titulo">Revisa y envía</h1>' +
      '<p class="ayuda">Contestaste ' + contestadas + ' de ' + N + '. ' +
      (contestadas < N ? 'Lo que falte lo vemos contigo por llamada o lo definimos nosotros.' : 'Gracias, con esto avanzamos.') + '</p>';
    var g = resumenPorSeccion();
    for (var s = 0; s < g.orden.length; s++) {
      h += '<div class="bloque"><h2>' + esc(g.orden[s]) + '</h2>';
      var lista = g.mapa[g.orden[s]];
      for (var j = 0; j < lista.length; j++) {
        var idx = lista[j], q = PREGUNTAS[idx], t = textoRespuesta(q), c = recorta((est.r[q.id] || {}).c);
        h += '<div class="fila"><div class="cuerpo"><div class="q">' + (idx + 1) + '. ' + esc(q.t) + '</div>' +
          '<div class="a' + (t ? '' : ' vacia') + '">' + (t ? esc(t) : 'Sin contestar') + '</div>' +
          (c ? '<div class="q">' + esc(c) + '</div>' : '') + '</div>' +
          '<button type="button" data-ir="' + (idx + 1) + '" aria-label="Cambiar la pregunta ' + (idx + 1) + '">Cambiar</button></div>';
      }
      h += '</div>';
    }
    var aparte = est.r.mandar && est.r.mandar.v ? est.r.mandar.v : [];
    if (aparte.length) {
      h += '<div class="aparte"><strong>No olvides mandarnos por WhatsApp:</strong><ul>';
      for (i = 0; i < aparte.length; i++) { h += '<li>' + esc(aparte[i]) + '</li>'; }
      h += '</ul></div>';
    }
    h += '<div class="acciones">' +
      '<button type="button" class="btn primario grande" id="btnWa">Enviar por WhatsApp</button>' +
      '<button type="button" class="btn grande" id="btnDescargar">Descargar mis respuestas</button>' +
      '<button type="button" class="btn grande" id="btnCopiar">Copiar mis respuestas</button>' +
      '</div><p class="aviso-envio" id="notaEnvio" role="status"></p>' +
      '<button type="button" class="peligro" data-act="borrar">Borrar mis respuestas de este aparato</button></section>';
    return h;
  }

  /* ---------------- Navegación ---------------- */
  function pintar() {
    var p = est.paso;
    $('top').hidden = p === 0;
    $('dock').hidden = p === 0 || p === FINAL;
    if (p === 0) { pan.innerHTML = htmlBienvenida(); }
    else if (p === FINAL) { pan.innerHTML = htmlResumen(); }
    else { pan.innerHTML = htmlPregunta(PREGUNTAS[p - 1]); }
    if (p > 0) {
      var tope = Math.min(p, N);
      $('progreso').style.width = (p === FINAL ? 100 : Math.round(((p - 1) / N) * 100)) + '%';
      $('estado').textContent = p === FINAL ? 'Resumen' : 'Pregunta ' + tope + ' de ' + N;
      $('btnSig').innerHTML = p === N ? 'Ver resumen &rarr;' : 'Siguiente &rarr;';
    }
    window.scrollTo(0, 0);
    try { pan.focus({ preventScroll: true }); } catch (e) { /* navegador viejo */ }
  }

  function ir(n) {
    if (timer) { clearTimeout(timer); timer = null; }
    est.paso = Math.max(0, Math.min(FINAL, n));
    est.com = false;
    guardar();
    pintar();
  }

  /* ---------------- Mensaje de envío ---------------- */
  function armarTexto() {
    var f = new Date();
    var fecha = f.getDate() + '/' + (f.getMonth() + 1) + '/' + f.getFullYear();
    var L = ['Cuestionario ZAMMIR (' + fecha + ')', ''];
    var g = resumenPorSeccion();
    for (var s = 0; s < g.orden.length; s++) {
      L.push('*' + g.orden[s] + '*');
      var lista = g.mapa[g.orden[s]];
      for (var j = 0; j < lista.length; j++) {
        var idx = lista[j], q = PREGUNTAS[idx], t = textoRespuesta(q), c = recorta((est.r[q.id] || {}).c);
        L.push((idx + 1) + '. ' + q.t);
        L.push('   → ' + (t || 'Sin contestar') + (c ? ' (' + c + ')' : ''));
      }
      L.push('');
    }
    return L.join('\n');
  }

  function nombreArchivo() {
    var f = new Date();
    function d2(n) { return (n < 10 ? '0' : '') + n; }
    return 'cuestionario-zammir-' + f.getFullYear() + '-' + d2(f.getMonth() + 1) + '-' + d2(f.getDate()) + '.txt';
  }

  function enviarWhatsApp() {
    var txt = armarTexto(), largo = false;
    if (txt.length > 3600) {
      txt = txt.slice(0, 3600);
      txt = txt.slice(0, txt.lastIndexOf('\n')) + '\n…(mensaje recortado; te mando el archivo completo)';
      largo = true;
    }
    var base = NUMERO_WHATSAPP ? 'https://wa.me/' + NUMERO_WHATSAPP : 'https://wa.me/';
    window.open(base + '?text=' + encodeURIComponent(txt), '_blank');
    $('notaEnvio').textContent = largo
      ? 'Tus respuestas son largas: el mensaje salió recortado. Descarga el archivo y mándalo también por WhatsApp.'
      : 'Se abrió WhatsApp con tus respuestas. Solo falta darle enviar.';
  }

  function descargar() {
    var blob = new Blob([armarTexto()], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombreArchivo();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    $('notaEnvio').textContent = 'Se descargó el archivo. Mándalo por WhatsApp o correo.';
  }

  function copiar() {
    var txt = armarTexto();
    function listo() { $('notaEnvio').textContent = 'Copiado. Pégalo en WhatsApp o en un correo.'; }
    function respaldo() {
      var t = document.createElement('textarea');
      t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); listo(); } catch (e) { $('notaEnvio').textContent = 'No se pudo copiar. Usa "Descargar".'; }
      document.body.removeChild(t);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(listo, respaldo);
    } else { respaldo(); }
  }

  /* ---------------- Eventos ---------------- */
  function tocarOpcion(btn) {
    var q = PREGUNTAS[est.paso - 1], r = R(q.id), k = Number(btn.getAttribute('data-k')), val = q.op[k];
    var botones = pan.querySelectorAll('.op'), i;
    if (q.tipo === 'varios') {
      var arr = r.v || [], pos = arr.indexOf(val);
      if (pos > -1) { arr.splice(pos, 1); } else { arr.push(val); }
      r.v = arr;
    } else {
      r.v = r.v === val ? null : val;
    }
    for (i = 0; i < botones.length; i++) {
      var on = q.tipo === 'varios' ? (r.v || []).indexOf(q.op[i]) > -1 : r.v === q.op[i];
      botones[i].className = 'op' + (on ? ' on' : '');
      botones[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    guardar();
    // Una sola respuesta y sin comentario obligatorio: avanza sola
    if (q.tipo === 'uno' && r.v && !q.nota && !est.com && recorta(r.c) === '') {
      var actual = est.paso;
      if (timer) { clearTimeout(timer); }
      timer = setTimeout(function () { timer = null; if (est.paso === actual) { ir(actual + 1); } }, 380);
    } else if (timer) { clearTimeout(timer); timer = null; }
  }

  pan.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== pan && !(el.getAttribute && (el.getAttribute('data-k') !== null || el.getAttribute('data-act') || el.getAttribute('data-ir') || el.id))) { el = el.parentNode; }
    if (!el || el === pan) { return; }
    var act = el.getAttribute('data-act');
    if (el.id === 'btnEmpezar') { ir(est.paso > 0 ? est.paso : 1); return; }
    if (el.id === 'btnWa') { enviarWhatsApp(); return; }
    if (el.id === 'btnDescargar') { descargar(); return; }
    if (el.id === 'btnCopiar') { copiar(); return; }
    if (el.getAttribute('data-ir')) { ir(Number(el.getAttribute('data-ir'))); return; }
    if (el.getAttribute('data-k') !== null) { tocarOpcion(el); return; }
    if (act === 'coment') { est.com = true; pintar(); var c = $('coment'); if (c) { c.focus(); } return; }
    if (act === 'reiniciar') { est.r = {}; ir(1); return; }
    if (act === 'borrar') {
      if (window.confirm('¿Borrar todas tus respuestas de este aparato?')) { est.r = {}; ir(0); }
    }
  });

  pan.addEventListener('input', function (e) {
    var id = e.target.id, q = PREGUNTAS[est.paso - 1];
    if (!q) { return; }
    var r = R(q.id);
    if (id === 'campo') { r.v = e.target.value; }
    else if (id === 'otro') { r.o = e.target.value; }
    else if (id === 'coment') { r.c = e.target.value; }
    else { return; }
    guardar();
  });

  $('btnSig').addEventListener('click', function () { ir(est.paso + 1); });
  $('btnAtras').addEventListener('click', function () { ir(est.paso - 1); });

  window.addEventListener('error', function () {
    if (!pan.innerHTML) { $('falla').hidden = false; }
  });

  cargar();
  pintar();
})();
</script>
</body>
</html>
